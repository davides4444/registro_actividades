<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro y Centro de Mando IA</title>
  <meta name="theme-color" content="#2563eb">
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f1f5f9; color: #1e293b; padding-bottom: 70px; }
    
    /* Navegación por Pestañas */
    .tab-bar {
      position: fixed; bottom: 0; left: 0; right: 0; background: #ffffff;
      display: flex; justify-content: space-around; border-top: 1px solid #e2e8f0; z-index: 1000;
    }
    .tab-btn {
      flex: 1; padding: 12px 0; text-align: center; background: none; border: none;
      font-size: 0.8rem; font-weight: 600; color: #64748b; cursor: pointer;
    }
    .tab-btn.active { color: #2563eb; border-top: 3px solid #2563eb; }

    .container { max-width: 500px; margin: 16px auto; padding: 16px; background: #fff; border-radius: 12px; }
    .page { display: none; }
    .page.active { display: block; }

    /* Estilos del Formulario */
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
    input, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; }
    .btn { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-weight: 600; }

    /* Estilos del Chat */
    .chat-box { height: 320px; overflow-y: auto; border: 1px solid #e2e8f0; padding: 10px; border-radius: 8px; margin-bottom: 10px; background: #f8fafc; }
    .msg { margin-bottom: 10px; padding: 8px 12px; border-radius: 8px; font-size: 0.9rem; max-width: 85%; }
    .msg.user { background: #2563eb; color: #fff; margin-left: auto; }
    .msg.ia { background: #e2e8f0; color: #0f172a; margin-right: auto; }
  </style>
</head>
<body>

  <!-- PESTAÑA 1: REGISTRO -->
  <div id="page-registro" class="page active">
    <div class="container">
      <h2>📝 Registrar Actividad</h2>
      <form id="activityForm">
        <div class="form-group"><label>Fecha</label><input type="date" id="fecha" required></div>
        <div class="form-group"><label>Nombre</label><input type="text" id="nombre" required></div>
        <div class="form-group"><label>Cargo</label><input type="text" id="cargo" required></div>
        <div class="form-group"><label>Actividad</label><textarea id="actividad" required></textarea></div>
        <button type="submit" class="btn">Enviar Registro</button>
      </form>
    </div>
  </div>

  <!-- PESTAÑA 2: DASHBOARD -->
  <div id="page-dashboard" class="page">
    <div class="container">
      <h2>📊 Dashboard de IA</h2>
      <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 12px;">Haz clic para generar el análisis consolidado de la hoja.</p>
      <button class="btn" onclick="solicitarDashboard()">Cargar Dashboard</button>
      <div id="dashboardOutput" style="margin-top: 15px; white-space: pre-line; font-size: 0.85rem;"></div>
    </div>
  </div>

  <!-- PESTAÑA 3: CHAT IA -->
  <div id="page-chat" class="page">
    <div class="container">
      <h2>💬 Consulta a Gemini</h2>
      <div class="chat-box" id="chatBox">
        <div class="msg ia">¡Hola! Hazme cualquier consulta sobre el desempeño o las ventas registradas.</div>
      </div>
      <div style="display: flex; gap: 6px;">
        <input type="text" id="chatInput" placeholder="Ej: ¿Por qué bajaron las ventas el martes?">
        <button class="btn" style="width: 80px;" onclick="enviarMensajeChat()">Enviar</button>
      </div>
    </div>
  </div>

  <!-- NAVEGACIÓN INFERIOR -->
  <div class="tab-bar">
    <button class="tab-btn active" onclick="cambiarPestaña('registro')">📝 Registrar</button>
    <button class="tab-btn" onclick="cambiarPestaña('dashboard')">📊 Dashboard</button>
    <button class="tab-btn" onclick="cambiarPestaña('chat')">💬 Chat IA</button>
  </div>

<script>
  function cambiarPestaña(pestaña) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`page-${pestaña}`).classList.add('active');
    event.currentTarget.classList.add('active');
  }

  // Código de envío offline/online y conexión con Apps Script
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyB7zFaK_IEa_qeVfcwv_yvPG1XteOMDWqTh-RyAqr3ruRuolLMPn7-LrYnGepCEocg/exec";

  document.getElementById("fecha").value = new Date().toISOString().split('T')[0];

  function enviarMensajeChat() {
    const input = document.getElementById("chatInput");
    const msg = input.value.trim();
    if (!msg) return;

    const chatBox = document.getElementById("chatBox");
    chatBox.innerHTML += `<div class="msg user">${msg}</div>`;
    input.value = "";
    chatBox.scrollTop = chatBox.scrollHeight;

    // Indicador de pensando
    chatBox.innerHTML += `<div class="msg ia" id="loading">Analizando registros...</div>`;

    fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ accion: "chat", pregunta: msg })
    })
    .then(r => r.text())
    .then(res => {
      document.getElementById("loading").remove();
      chatBox.innerHTML += `<div class="msg ia">${res}</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;
    })
    .catch(() => {
      document.getElementById("loading").remove();
      chatBox.innerHTML += `<div class="msg ia">Revisa tu conexión a internet para chatear.</div>`;
    });
  }
</script>

</body>
</html>
